<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Kivisense CRM</title>
  <link rel="icon" href="../assets/kivisense-logo.svg">
  <link rel="stylesheet" href="../styles/production.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7-1a3.5 3.5 0 1 0 0-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M2 21v-2a6 6 0 0 1 12 0v2m1-7a5 5 0 0 1 7 4.6V20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-lead" viewBox="0 0 24 24"><path d="M4 4h16v5H4zM6 9v11h12V9M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1-2.9 2.9-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21H10v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1-2.9-2.9.1-.1A1.6 1.6 0 0 0 4.6 15 1.6 1.6 0 0 0 3.1 14H3v-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1 2.9-2.9.1.1a1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5V3h4v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1 2.9 2.9-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1h.1v4h-.1a1.6 1.6 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19v2h16v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 19v2h16v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.9-10.9a2.1 2.1 0 0 0-3-3L5.2 16 4 20Zm10.6-13.4 2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M6 10h12v11H6zM8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="m8.5 12.5 6.2-6.2a3 3 0 0 1 4.3 4.2l-8.1 8.1a5 5 0 0 1-7.1-7.1l8-8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="9" cy="10" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m4 18 5-5 3 3 2-2 6 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 10 5-3v10l-5-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="primarySidebar" aria-label="主导航">
      <button class="brand-lockup" id="brandLockup" type="button" aria-label="返回首页">
        <span class="app-brand-logo-shell"><img class="app-brand-logo" src="../assets/kivisense-logo.svg" alt="Kivisense 标志"></span>
        <span class="app-brand-wordmark"><strong>KIVISENSE CRM</strong><span>2.0</span></span>
      </button>
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="展开或收起侧栏" title="展开或收起侧栏"><svg><use href="#i-chevron"/></svg></button>

      <nav>
        <div class="nav-label">客户管理</div>
        <div class="nav-list">
          <button class="nav-item" type="button" data-route="dashboard" data-crm-any-permission="crm.dashboard.self.view,crm.dashboard.management.view"><svg class="icon"><use href="#i-lead"/></svg><span>Dashboard</span></button>
          <button class="nav-item" type="button" data-route="organizations" data-crm-permission="crm.organization.view"><svg class="icon"><use href="#i-file"/></svg><span>公司</span><b class="nav-count" data-nav-count="organizations">0</b></button>
          <button class="nav-item" type="button" data-route="contacts" data-crm-permission="crm.contact.view"><svg class="icon"><use href="#i-users"/></svg><span>客户联系人</span><b class="nav-count" data-nav-count="contacts">0</b></button>
          <button class="nav-item" type="button" data-route="leads" data-crm-permission="crm.lead.view"><svg class="icon"><use href="#i-lead"/></svg><span>线索</span><b class="nav-count" data-nav-count="leads">0</b></button>
          <button class="nav-item" type="button" data-route="operations" data-crm-permission="crm.organization.view"><svg class="icon"><use href="#i-clock"/></svg><span>客户运营</span></button>
          <button class="nav-item" type="button" data-route="workbench" data-crm-permission="crm.task.view"><svg class="icon"><use href="#i-check"/></svg><span>我的工作台</span></button>
          <button class="nav-item" type="button" data-route="vendors" data-crm-permission="crm.organization.view"><svg class="icon"><use href="#i-file"/></svg><span>供应商</span></button>
        </div>
        <div class="nav-label system-nav-label" data-crm-permission="account.view">系统管理</div>
        <div class="nav-list">
          <button class="nav-item" type="button" data-route="accounts" data-crm-permission="account.view"><svg class="icon"><use href="#i-user"/></svg><span>账户管理</span></button>
          <button class="nav-item" type="button" data-route="roles" data-crm-permission="roles.view"><svg class="icon"><use href="#i-lock"/></svg><span>角色与权限</span></button>
          <button class="nav-item" type="button" data-route="audit" data-crm-permission="audit.view"><svg class="icon"><use href="#i-file"/></svg><span>审计日志</span></button>
        </div>
      </nav>

      <div class="account-area">
        <div class="account-menu" id="accountMenu" role="menu" hidden>
          <div class="account-menu-identity"><strong id="accountMenuName">系统管理员</strong><span id="accountMenuRole">角色</span></div>
          <button id="personalSettingsAction" type="button" role="menuitem"><svg><use href="#i-user"/></svg>个人设置</button>
          <button id="changePasswordAction" type="button" role="menuitem"><svg><use href="#i-lock"/></svg>修改密码</button>
          <button class="danger" id="logoutAction" type="button" role="menuitem"><svg><use href="#i-arrow"/></svg>退出登录</button>
        </div>
        <button class="sidebar-footer account-trigger" id="accountMenuTrigger" type="button" aria-haspopup="menu" aria-expanded="false">
          <span class="admin-avatar" id="adminAvatar">管</span>
          <span class="admin-copy"><strong id="adminName">系统管理员</strong><span id="adminRole">角色</span></span>
          <svg class="account-chevron"><use href="#i-chevron"/></svg>
        </button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="breadcrumb">Kivisense CRM&nbsp;&nbsp;/&nbsp;&nbsp;<strong id="breadcrumbCurrent">客户联系人</strong></div>
      </header>
      <section id="crmLeadsView" class="view"></section>
      <section id="crmLeadDetailView" class="view"></section>
      <section id="crmContactsView" class="view"></section>
      <section id="crmContactDetailView" class="view"></section>
      <section id="dashboardView" class="view"></section>
      <section id="organizationsView" class="view"></section>
      <section id="organizationDetailView" class="view"></section>
      <section id="customerOperationsView" class="view"></section>
      <section id="workbenchView" class="view"></section>
      <section id="vendorsView" class="view"></section>
      <section id="accountsView" class="view"></section>
      <section id="rolesView" class="view"></section>
      <section id="auditView" class="view"></section>
    </main>
  </div>

  <aside class="security-drawer" id="personalSettingsDrawer" aria-hidden="true">
    <button class="security-drawer-backdrop" id="closePersonalSettingsBackdrop" type="button" aria-label="关闭个人设置"></button>
    <section class="security-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="personalSettingsTitle">
      <header class="security-drawer-header"><div><h2 id="personalSettingsTitle">个人设置</h2><p>查看账号信息和安全设置</p></div><button class="dialog-close" id="closePersonalSettings" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="security-drawer-body" id="personalSettingsBody"></div>
      <footer class="security-drawer-footer"><button class="btn" id="closePersonalSettingsFooter" type="button">关闭</button></footer>
    </section>
  </aside>

  <dialog class="security-modal" id="changePasswordDialog">
    <form method="dialog" id="changePasswordForm">
      <header class="dialog-header"><div><h2 id="changePasswordTitle">修改密码</h2><p>密码至少 12 位，建议包含多种字符</p></div><button class="dialog-close" id="closeChangePassword" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="dialog-body password-fields">
        <label class="password-control"><span class="field-label">当前密码</span><input class="control" id="currentPasswordInput" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="currentPasswordInput">显示</button></label>
        <label class="password-control"><span class="field-label">新密码</span><input class="control" id="newPasswordInput" type="password" autocomplete="new-password" minlength="12" required><button class="password-toggle" type="button" data-password-toggle="newPasswordInput">显示</button><span class="password-strength" id="changePasswordStrength"><span class="password-strength-track"><span class="password-strength-fill"></span></span><span class="password-strength-label">密码强度：-</span></span></label>
        <label class="password-control"><span class="field-label">确认新密码</span><input class="control" id="confirmPasswordInput" type="password" autocomplete="new-password" minlength="12" required><button class="password-toggle" type="button" data-password-toggle="confirmPasswordInput">显示</button></label>
        <div class="auth-error" id="changePasswordError" role="alert" hidden></div>
      </div>
      <footer class="dialog-footer"><span class="spacer"></span><button class="btn" id="cancelChangePassword" type="button">取消</button><button class="btn btn-primary" type="submit">保存密码</button></footer>
    </form>
  </dialog>

  <aside class="security-drawer" id="accountDialog" aria-hidden="true">
    <button class="security-drawer-backdrop" id="closeAccountBackdrop" type="button" aria-label="关闭账号表单"></button>
    <form class="security-drawer-panel" id="accountForm">
      <header class="security-drawer-header"><div><h2 id="accountDialogTitle">新建账号</h2><p>配置账号身份、角色与状态</p></div><button class="dialog-close" id="closeAccountDialog" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="security-drawer-body">
        <section class="security-form-section"><h3>账号信息</h3><div class="security-form-grid">
          <label class="full"><span class="field-label">姓名</span><input class="control" id="accountNameInput" required maxlength="120"></label>
          <label class="full"><span class="field-label">登录账号</span><input class="control" id="accountLoginInput" required maxlength="191" autocomplete="off"></label>
          <label><span class="field-label">角色</span><select class="control" id="accountRoleInput" required></select></label>
          <label><span class="field-label">状态</span><select class="control" id="accountStatusInput"><option value="ACTIVE">启用</option><option value="DISABLED">禁用</option></select></label>
        </div></section>
        <div class="auth-error" id="accountFormError" role="alert" hidden></div>
      </div>
      <footer class="security-drawer-footer"><button class="btn" id="cancelAccountDialog" type="button">取消</button><button class="btn btn-primary" type="submit">保存账号</button></footer>
    </form>
  </aside>

  <div class="auth-overlay" id="loginOverlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
    <section class="auth-card">
      <div class="auth-brand"><img src="../assets/kivisense-logo.svg" alt="Kivisense 标志"><div><strong>KIVISENSE CRM</strong><span>内部系统</span></div></div>
      <h1 id="loginTitle">登录</h1>
      <p>请使用已分配的内部账号进入客户关系管理系统。</p>
      <form class="auth-form" id="loginForm">
        <label><span class="field-label">登录账号</span><input class="control" id="loginAccountInput" autocomplete="username" required></label>
        <label class="password-control"><span class="field-label">密码</span><input class="control" id="loginPasswordInput" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="loginPasswordInput">显示</button></label>
        <div class="auth-error" id="loginError" role="alert" hidden></div>
        <div class="auth-actions"><button class="btn btn-quiet" id="forgotPasswordAction" type="button">忘记密码</button><button class="btn btn-primary" type="submit">进入系统</button></div>
      </form>
    </section>
  </div>

  <dialog class="security-modal" id="forgotPasswordDialog">
    <section>
      <header class="dialog-header"><div><h2>忘记密码</h2><p>内部账号安全说明</p></div><button class="dialog-close" id="closeForgotPassword" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="dialog-body"><p class="security-modal-copy">请联系系统管理员重置密码。为保护账号安全，系统不会通过页面展示或发送现有密码。</p></div>
      <footer class="dialog-footer"><span class="spacer"></span><button class="btn btn-primary" id="ackForgotPassword" type="button">知道了</button></footer>
    </section>
  </dialog>

  <dialog class="security-modal" id="confirmationDialog">
    <section>
      <header class="dialog-header"><div><h2 id="confirmationTitle">确认操作</h2><p>请确认是否继续</p></div><button class="dialog-close" id="closeConfirmation" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="dialog-body"><p class="security-modal-copy" id="confirmationMessage"></p></div>
      <footer class="dialog-footer"><span class="spacer"></span><button class="btn" id="cancelConfirmation" type="button">取消</button><button class="btn btn-primary" id="confirmAction" type="button">确认</button></footer>
    </section>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-icon"><svg><use href="#i-check"/></svg></span><span id="toastText">已保存</span></div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
