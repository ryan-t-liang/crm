<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111713">
  <title>Kivisense CRM 2.0</title>
  <link rel="icon" href="assets/kivisense-logo.svg">
  <link rel="stylesheet" href="styles/production.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7-1a3.5 3.5 0 1 0 0-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M2 21v-2a6 6 0 0 1 12 0v2m1-7a5 5 0 0 1 7 4.6V20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-lead" viewBox="0 0 24 24"><path d="M4 4h16v5H4zM6 9v11h12V9M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1-2.9 2.9-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21H10v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1-2.9-2.9.1-.1A1.6 1.6 0 0 0 4.6 15 1.6 1.6 0 0 0 3.1 14H3v-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1 2.9-2.9.1.1a1.6 1.6 0 0 0 1.8.3 1.6 1.6 0 0 0 1-1.5V3h4v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1 2.9 2.9-.1.1a1.6 1.6 0 0 0-.3 1.8 1.6 1.6 0 0 0 1.5 1h.1v4h-.1a1.6 1.6 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19v2h16v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0 4 4m-4-4L8 8M4 19v2h16v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.2-1 10.9-10.9a2.1 2.1 0 0 0-3-3L5.2 16 4 20Zm10.6-13.4 2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M6 10h12v11H6zM8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h5M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <button class="brand-lockup" id="brandLockup" type="button" aria-label="返回首页">
        <span class="app-brand-logo-shell"><img class="app-brand-logo" src="assets/kivisense-logo.svg" alt="Kivisense"></span>
        <span class="app-brand-wordmark"><strong>Kivisense</strong><span>CRM 2.0</span></span>
      </button>
      <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="展开或收起侧栏" title="展开或收起侧栏"><svg><use href="#i-chevron"/></svg></button>

      <nav>
        <div class="nav-label">客户管理</div>
        <div class="nav-list">
          <button class="nav-item" type="button" data-route="leads" data-crm-permission="crm.lead.view"><svg class="icon"><use href="#i-lead"/></svg><span>线索</span><b class="nav-count" data-nav-count="leads">0</b></button>
          <button class="nav-item" type="button" data-route="contacts" data-crm-permission="crm.contact.view"><svg class="icon"><use href="#i-users"/></svg><span>客户联系人</span><b class="nav-count" data-nav-count="contacts">0</b></button>
        </div>
        <div class="nav-label system-nav-label" data-crm-permission="account.view">系统管理</div>
        <div class="nav-list">
          <button class="nav-item" type="button" data-route="accounts" data-crm-permission="account.view"><svg class="icon"><use href="#i-user"/></svg><span>账户管理</span></button>
          <button class="nav-item" type="button" data-route="roles" data-crm-permission="roles.view"><svg class="icon"><use href="#i-lock"/></svg><span>角色与权限</span></button>
          <button class="nav-item" type="button" data-route="audit" data-crm-permission="audit.view"><svg class="icon"><use href="#i-file"/></svg><span>审计日志</span></button>
        </div>
      </nav>

      <button class="sidebar-footer" id="accountMenuTrigger" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="admin-avatar" id="adminAvatar">管</span>
        <span class="admin-copy"><strong id="adminName">系统管理员</strong><span id="adminRole">角色</span></span>
        <svg class="account-chevron"><use href="#i-chevron"/></svg>
      </button>
      <div class="account-menu" id="accountMenu" role="menu" hidden>
        <div class="account-menu-identity"><strong id="accountMenuName">系统管理员</strong><span id="accountMenuRole">角色</span></div>
        <button id="changePasswordAction" type="button" role="menuitem"><svg><use href="#i-lock"/></svg>修改密码</button>
        <button id="logoutAction" type="button" role="menuitem"><svg><use href="#i-arrow"/></svg>退出登录</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>Kivisense CRM 2.0</span><svg><use href="#i-chevron"/></svg><strong id="breadcrumbCurrent">线索</strong></div>
        <label class="global-search"><svg><use href="#i-search"/></svg><input id="globalSearchInput" type="search" placeholder="搜索客户联系人或线索" aria-label="全局搜索"></label>
      </header>
      <section id="crmLeadsView" class="view"></section>
      <section id="crmLeadDetailView" class="view"></section>
      <section id="crmContactsView" class="view"></section>
      <section id="crmContactDetailView" class="view"></section>
      <section id="accountsView" class="view"></section>
      <section id="rolesView" class="view"></section>
      <section id="auditView" class="view"></section>
    </main>
  </div>

  <dialog class="security-modal" id="changePasswordDialog">
    <form method="dialog" id="changePasswordForm">
      <header class="dialog-header"><div><span class="eyebrow">账号安全</span><h2 id="changePasswordTitle">修改密码</h2></div><button class="dialog-close" id="closeChangePassword" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="dialog-body form-stack">
        <label><span>当前密码</span><input id="currentPasswordInput" type="password" autocomplete="current-password" required></label>
        <label><span>新密码</span><input id="newPasswordInput" type="password" autocomplete="new-password" minlength="12" required></label>
        <label><span>确认新密码</span><input id="confirmPasswordInput" type="password" autocomplete="new-password" minlength="12" required></label>
        <div class="inline-alert error" id="changePasswordError" role="alert" hidden></div>
      </div>
      <footer class="dialog-footer"><button class="btn" id="cancelChangePassword" type="button">取消</button><button class="btn btn-primary" type="submit">保存密码</button></footer>
    </form>
  </dialog>

  <dialog class="security-modal" id="accountDialog">
    <form method="dialog" id="accountForm">
      <header class="dialog-header"><h2 id="accountDialogTitle">新建账号</h2><button class="dialog-close" id="closeAccountDialog" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button></header>
      <div class="dialog-body form-stack">
        <label><span>姓名</span><input id="accountNameInput" required maxlength="120"></label>
        <label><span>登录账号</span><input id="accountLoginInput" required maxlength="191" autocomplete="off"></label>
        <label><span>角色</span><select id="accountRoleInput" required></select></label>
        <label><span>状态</span><select id="accountStatusInput"><option value="ACTIVE">启用</option><option value="DISABLED">禁用</option></select></label>
        <div class="inline-alert error" id="accountFormError" role="alert" hidden></div>
      </div>
      <footer class="dialog-footer"><button class="btn" id="cancelAccountDialog" type="button">取消</button><button class="btn btn-primary" type="submit">保存账号</button></footer>
    </form>
  </dialog>

  <div class="auth-overlay" id="loginOverlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle" hidden>
    <section class="login-panel">
      <div class="login-brand"><span class="login-logo-shell"><img src="assets/kivisense-logo.svg" alt="Kivisense"></span><div><strong>Kivisense</strong><span>CRM 2.0</span></div></div>
      <form id="loginForm">
        <header><span class="eyebrow">内部客户管理系统</span><h1 id="loginTitle">登录</h1><p>请使用已分配的账号进入系统。</p></header>
        <label><span>登录账号</span><input id="loginAccountInput" autocomplete="username" required></label>
        <label><span>密码</span><input id="loginPasswordInput" type="password" autocomplete="current-password" required></label>
        <div class="inline-alert error" id="loginError" role="alert" hidden></div>
        <button class="btn btn-primary login-submit" type="submit">进入系统</button>
      </form>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span class="toast-icon"><svg><use href="#i-check"/></svg></span><span id="toastText">已保存</span></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
