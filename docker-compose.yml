services:
  mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: sowind_crm
      MYSQL_USER: sowind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sowind_dev_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sowind_root_dev_only}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - sowind_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-sowind_root_dev_only}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql://sowind:${MYSQL_PASSWORD:-sowind_dev_only}@mysql:3306/sowind_crm
      PORT: 3000
      STORAGE_DIR: /app/storage
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

volumes:
  sowind_mysql_data:
